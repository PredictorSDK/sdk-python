[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predictorsdk"
version = "0.24.0"
description = "The official Python client for the PredictorSDK matching markets API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "PredictorSDK", email = "nick@predictorsdk.com" }]
keywords = ["predictorsdk", "sports", "betting", "prediction-markets", "kalshi", "polymarket", "sdk"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.21.2",
    "pydantic>=1.9.2",
    "typing_extensions>=4.0.0",
]

# The generated client imports httpx_aiohttp when it is installed and uses it
# for the default async client; without it, DefaultAioHttpClient tells the user
# to `pip install predictorsdk[aiohttp]` (see predictorsdk/_default_clients.py).
# httpx-aiohttp brings aiohttp.
[project.optional-dependencies]
aiohttp = ["httpx-aiohttp>=0.1.8"]

[project.urls]
Homepage = "https://docs.predictorsdk.com"
Repository = "https://github.com/PredictorSDK/sdk-python"
Issues = "https://github.com/PredictorSDK/sdk-python/issues"

[tool.setuptools.package-data]
predictorsdk = ["py.typed"]

[tool.setuptools.packages.find]
include = ["predictorsdk*"]
# Fern generates a tests/ directory inside the package; it is not part of the
# installed client.
exclude = ["predictorsdk.tests*"]
